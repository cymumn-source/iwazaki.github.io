function send(ev){
  ev.preventDefault();
  var f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn');
  err.textContent='';
  var d={};['website','name','email','type','fee','start','message'].forEach(function(k){d[k]=f.elements[k].value;});
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){err.textContent='メールアドレスを正しく入力してください。';return false;}
  if(!d.message.trim()){err.textContent='ご相談内容を入力してください。';return false;}
  btn.disabled=true;btn.textContent='送信中…';
  var body=new URLSearchParams(d).toString();
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(){
    document.getElementById('formCard').style.display='none';document.getElementById('thanks').style.display='block';window.scrollTo(0,0);
  }).catch(function(){err.textContent='送信できませんでした。時間をおいて、もう一度お試しください。';btn.disabled=false;btn.textContent='送信する';});
  return false;
}
